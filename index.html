<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>소원의 연못 🪙 · 도파#</title>
  <meta name="description" content="QR을 찍고 내가 꾸민 동전을 연못에 던져 소원을 빌어요. 여러 명이 던진 동전이 연못에 계속 쌓여요.">
  <meta name="theme-color" content="#cfe8fb">
  <meta name="dopasharp:game" content="wish-pond">
  <link rel="canonical" href="https://dopasharp.github.io/wish-pond/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="도파# dopa.shap">
  <meta property="og:title" content="소원의 연못 🪙">
  <meta property="og:description" content="내가 꾸민 동전을 던져 소원을 빌어요. 거북 등에 올리면 대길!">
  <meta property="og:url" content="https://dopasharp.github.io/wish-pond/">
  <meta property="og:image" content="https://dopasharp.github.io/wish-pond/og/wish.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="dopasharp/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dopasharp/tokens.css">
  <link rel="stylesheet" href="dopasharp/components.css">
  <link rel="stylesheet" href="css/style.css?v=5">
  <script src="dopasharp/dopasharp.js" defer></script>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/pond.js?v=5"></script>
</head>
<body class="pond-page">
  <canvas id="scene" aria-label="소원의 연못 3D 화면"></canvas>

  <header data-dopa="header" class="pond-header"></header>

  <div class="pond-title" aria-live="polite">
    <h1>소원의 연못</h1>
    <p><span id="total">🪙 0개</span> · <span id="online">지금 0명</span> · <span id="wind" title="바람">바람 –</span></p>
  </div>

  <aside class="board" aria-label="소원 성취 게시판">
    <h2>🎉 소원 성취</h2>
    <ol id="board-list" class="board-list"><li class="board-empty">거북 등이나 항아리에 동전을 올리면<br>소원이 여기에 익명으로 떠요.</li></ol>
  </aside>

  <section class="qr-card" id="qr-card" aria-label="동전 던지러 가기">
    <div id="qr" class="qr"></div>
    <div class="qr-text">
      <strong>QR 찍고<br>동전 던지기</strong>
      <span>한 번에 3개 · 여러 명 동시에</span>
      <a id="qr-link" class="qr-link" href="coin.html" target="_blank" rel="noopener">coin.html</a>
    </div>
    <button id="qr-fold" class="qr-fold" type="button" aria-label="QR 접기" aria-expanded="true">－</button>
  </section>
  <button id="qr-open" class="chip qr-open" type="button" hidden>📱 QR 펼치기</button>

  <p class="orbit-hint" id="orbit-hint">👆 드래그로 둘러보기 · 휠/핀치로 확대</p>
  <div class="pond-tools">
    <button id="sound-btn" class="chip" type="button">🔇 소리 켜기</button>
    <button id="fs-btn" class="chip" type="button">⛶ 전체 화면</button>
  </div>

  <div id="feed" class="feed" aria-live="polite"></div>
  <div id="banner" class="banner" hidden></div>
  <div id="peek" class="peek" hidden></div>
  <p id="mode-note" class="mode-note" hidden></p>
</body>
</html>
